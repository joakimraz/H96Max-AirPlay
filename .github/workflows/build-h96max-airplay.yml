name: H96 Max AirPlay - Build corrected APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout AirPlay Server v0.0.36
        uses: actions/checkout@v4
        with:
          repository: jqssun/android-airplay-server
          ref: v0.0.36
          submodules: recursive
          fetch-depth: 0

      - name: Disable unsupported Picture-in-Picture on H96 Max
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("app/src/main/kotlin/io/github/jqssun/airplay/MainActivity.kt")
          text = source.read_text(encoding="utf-8")

          start_marker = "        // auto-enter pre-declared in pip params\n"
          end_marker = "\n        setContent {\n"
          assert text.count(start_marker) == 1, "PiP setup start not found"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + "        // PiP disabled: H96 Max RK3518 firmware rejects this feature.\n" + text[end:]

          old = (
              "    fun enterPip() {\n"
              "        if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return\n"
              "        enterPictureInPictureMode(_pipParams())\n"
              "    }"
          )
          new = (
              "    fun enterPip() {\n"
              "        // Disabled on H96 Max (unsupported by device firmware).\n"
              "    }"
          )
          assert text.count(old) == 1, "Manual PiP entry point not found"
          text = text.replace(old, new)
          source.write_text(text, encoding="utf-8")

          manifest = Path("app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          assert xml.count('android:supportsPictureInPicture="true"') == 1
          manifest.write_text(xml.replace('android:supportsPictureInPicture="true"',
                                          'android:supportsPictureInPicture="false"'), encoding="utf-8")
          print("PiP disabled in activity and manifest.")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Install Android SDK components (using GitHub runner SDK)
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-37.0" "ndk;27.0.12077973" "cmake;3.22.1"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          # Some AGP versions look for android-37 even though the SDK is named android-37.0.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          ls -ld "$ANDROID_HOME/platforms/android-37" "$ANDROID_HOME/platforms/android-37.0"

      - name: Build corrected APK for ARM32
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: AirPlay-H96Max-fixed-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
